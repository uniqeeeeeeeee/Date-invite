<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Приглашение на свидание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Цвета: дневной «розовый» вариант ---------- */
  :root {
    color-scheme: light;
    --bg-top: #fdecee;
    --bg-bottom: #f4c6d1;
    --card: rgba(255, 250, 250, .8);
    --line: rgba(150, 44, 78, .45);
    --line-soft: rgba(150, 44, 78, .22);
    --ink: #4a1428;
    --muted: #835066;
    --accent: #b42a48;
    --accent2: #d9506e;
    --on-accent: #ffffff;
    --glow: rgba(217, 80, 110, .38);
    --input-bg: rgba(255, 255, 255, .78);
    --bokeh: rgba(255, 255, 255, .8);
    --bokeh2: rgba(232, 120, 146, .35);
    --petal1: #e0607c;
    --petal2: #f6b0be;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ---------- Ночной вариант: свечи и шампанское ---------- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg-top: #1b0817;
      --bg-bottom: #4d1231;
      --card: rgba(44, 12, 33, .72);
      --line: rgba(233, 197, 138, .55);
      --line-soft: rgba(233, 197, 138, .25);
      --ink: #fbe9dc;
      --muted: #dcaeb8;
      --accent: #f08aa0;
      --accent2: #e56b8c;
      --on-accent: #2a0a1c;
      --glow: rgba(240, 138, 160, .45);
      --input-bg: rgba(255, 255, 255, .07);
      --bokeh: rgba(255, 196, 140, .32);
      --bokeh2: rgba(240, 138, 160, .25);
      --petal1: #e56b8c;
      --petal2: #f7b3c2;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg-top: #1b0817;
    --bg-bottom: #4d1231;
    --card: rgba(44, 12, 33, .72);
    --line: rgba(233, 197, 138, .55);
    --line-soft: rgba(233, 197, 138, .25);
    --ink: #fbe9dc;
    --muted: #dcaeb8;
    --accent: #f08aa0;
    --accent2: #e56b8c;
    --on-accent: #2a0a1c;
    --glow: rgba(240, 138, 160, .45);
    --input-bg: rgba(255, 255, 255, .07);
    --bokeh: rgba(255, 196, 140, .32);
    --bokeh2: rgba(240, 138, 160, .25);
    --petal1: #e56b8c;
    --petal2: #f7b3c2;
  }

  html {
    height: 100%;
    scroll-padding-top: env(safe-area-inset-top, 0px);
    background: var(--bg-bottom);
  }
  body {
    margin: 0;
    min-height: 100%;
    box-sizing: border-box;
    padding: 28px 16px;
    display: grid;
    place-items: center;
    background-color: var(--bg-bottom);
    background-image: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 1rem;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ---------- Фон: боке и лепестки ---------- */
  .sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .bk { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--bokeh), transparent 68%); }
  .bk:nth-child(1) { width: 320px; height: 320px; left: -90px;  top: 6%;  }
  .bk:nth-child(2) { width: 180px; height: 180px; right: 8%;    top: 10%; background: radial-gradient(circle at 35% 35%, var(--bokeh2), transparent 68%); }
  .bk:nth-child(3) { width: 260px; height: 260px; right: -70px; top: 44%; }
  .bk:nth-child(4) { width: 140px; height: 140px; left: 12%;    bottom: 8%; background: radial-gradient(circle at 35% 35%, var(--bokeh2), transparent 68%); }
  .bk:nth-child(5) { width: 220px; height: 220px; left: 46%;    bottom: -60px; }
  .bk:nth-child(6) { width: 90px;  height: 90px;  left: 30%;    top: 4%; }
  .bk:nth-child(7) { width: 110px; height: 110px; right: 26%;   bottom: 22%; background: radial-gradient(circle at 35% 35%, var(--bokeh2), transparent 68%); }

  .petal {
    position: absolute; top: -40px;
    width: var(--sz); height: calc(var(--sz) * 1.3);
    background: linear-gradient(135deg, var(--petal1), var(--petal2));
    border-radius: 100% 0 100% 0;
    opacity: .7;
    animation: fall var(--dur) linear var(--delay) infinite;
  }
  @keyframes fall {
    from { transform: translate3d(0, -6vh, 0) rotate(0deg); }
    50%  { transform: translate3d(calc(var(--drift) * .5), 52vh, 0) rotate(200deg); }
    to   { transform: translate3d(var(--drift), 112vh, 0) rotate(380deg); }
  }

  /* ---------- Открытка ---------- */
  .card {
    position: relative; z-index: 1;
    width: min(100%, 520px);
    box-sizing: border-box;
    padding: 3rem 1.75rem 2.6rem;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: 0 30px 80px -30px var(--glow);
  }
  .card::before {
    content: ""; position: absolute; inset: 9px;
    border: 1px solid var(--line-soft); border-radius: 20px;
    pointer-events: none;
  }

  .step { display: none; }
  .step.on { display: block; animation: fadeIn .8s ease backwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .orn { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 1.4rem; }
  .orn i { display: block; width: 54px; height: 1px; background: var(--line); }
  .orn svg { width: 26px; height: 26px; fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-linejoin: round; }

  h1, h2 {
    margin: 0;
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-style: italic; font-weight: 500;
    line-height: 1.04;
    text-wrap: balance;
    outline: none;
  }
  h1 { font-size: clamp(2.6rem, 9.5vw, 4rem); }
  h2 { font-size: clamp(2.3rem, 8vw, 3.3rem); }

  .lead { margin: 1.1rem auto 0; max-width: 34ch; color: var(--muted); }

  /* ---------- Кнопки ---------- */
  .row { display: flex; gap: 16px; justify-content: center; align-items: center; margin-top: 2.2rem; }
  .btn {
    font: italic 600 1.55rem/1 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    min-height: 54px;
    padding: .8rem 2.3rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    cursor: pointer;
    color: var(--ink);
    background: transparent;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }

  .yes, .primary {
    border-color: transparent;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: var(--on-accent);
    box-shadow: 0 10px 30px -6px var(--glow);
    transition: transform .3s ease, box-shadow .3s ease;
  }
  .yes { transform: scale(var(--s, 1)); }
  .yes:hover { box-shadow: 0 14px 40px -4px var(--glow); }
  .primary { margin-top: 1.6rem; }
  .primary:hover { transform: translateY(-1px); }

  .no-slot { display: inline-flex; }
  .no { background: var(--input-bg); }
  .no.fixed {
    position: fixed; margin: 0; z-index: 50;
    transition: left .32s cubic-bezier(.2, .8, .3, 1), top .32s cubic-bezier(.2, .8, .3, 1);
  }

  .hint { min-height: 1.6em; margin: 1.4rem 0 0; color: var(--muted); font-size: .95rem; }

  /* ---------- Форма даты ---------- */
  .fields { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; margin: 2rem auto 0; max-width: 400px; text-align: left; }
  .field span { display: block; margin: 0 0 .35rem .3rem; font-size: .9rem; color: var(--muted); }
  input[type="date"], input[type="time"] {
    width: 100%; box-sizing: border-box;
    padding: .8rem .9rem;
    font: 600 1.05rem 'Manrope', system-ui, sans-serif;
    color: var(--ink);
    background: var(--input-bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    accent-color: var(--accent);
    min-height: 52px;
  }
  .err { min-height: 1.5em; margin: 1rem 0 0; color: var(--accent); font-weight: 600; font-size: .95rem; }

  /* ---------- Финал ---------- */
  .when { margin: 1.6rem 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: 1.15; }
  .when small { display: block; margin-top: .2rem; font-size: 1.45em; color: var(--accent); }
  .msg { margin: 1.2rem auto 0; max-width: 34ch; color: var(--muted); font-size: .95rem; user-select: text; }

  /* ---------- Сердечки при нажатии ---------- */
  .heart { position: fixed; z-index: 90; pointer-events: none; color: var(--accent); font-size: 22px; line-height: 1; will-change: transform, opacity; }

  @media (max-width: 380px) {
    .card { padding: 2.6rem 1.25rem 2.2rem; }
    .btn { padding: .8rem 1.8rem; }
    .fields { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .petal { display: none; }
    .step.on { animation: none; }
    .no.fixed, .yes, .primary { transition: none; }
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="bk"></div><div class="bk"></div><div class="bk"></div><div class="bk"></div>
  <div class="bk"></div><div class="bk"></div><div class="bk"></div>
  <div id="petals"></div>
</div>

<main class="card">

  <!-- 1. Вопрос -->
  <section class="step on" id="s1">
    <div class="orn"><i></i><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2 0 3.6 1.1 5.4 3 1.8-1.9 3.4-3 5.4-3 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg><i></i></div>
    <h1 tabindex="-1">Пойдёшь со мной на свидание?</h1>
    <p class="lead">Всего два варианта — выбирай внимательно.</p>
    <div class="row">
      <button class="btn yes" id="yes" type="button">Да</button>
      <span class="no-slot" id="slot"><button class="btn no" id="no" type="button">Нет</button></span>
    </div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </section>

  <!-- 2. Дата и время -->
  <section class="step" id="s2">
    <div class="orn"><i></i><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2 0 3.6 1.1 5.4 3 1.8-1.9 3.4-3 5.4-3 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg><i></i></div>
    <h2 tabindex="-1">Ура! Это лучший ответ</h2>
    <p class="lead">Выбери день и время — остальное я беру на себя.</p>
    <div class="fields">
      <label class="field"><span>День</span><input type="date" id="date"></label>
      <label class="field"><span>Время</span><input type="time" id="time" value="19:00"></label>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button class="btn primary" id="confirm" type="button" style="margin-top:.6rem">Подтвердить</button>
  </section>

  <!-- 3. Финал -->
  <section class="step" id="s3">
    <div class="orn"><i></i><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2 0 3.6 1.1 5.4 3 1.8-1.9 3.4-3 5.4-3 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg><i></i></div>
    <h2 tabindex="-1">Договорились</h2>
    <p class="when"><span id="whenDate"></span><small id="whenTime"></small></p>
    <p class="lead">Я уже жду этого дня. Остальное — сюрприз.</p>
    <button class="btn primary" id="send" type="button">Отправить ответ</button>
    <p class="msg" id="msg" aria-live="polite"></p>
  </section>

</main>

<script>
(function () {
  // Впиши сюда свой Telegram-username (без @) — и ответ придёт прямо тебе.
  // Пока пусто: откроется обычное меню «Поделиться», а если его нет — ответ скопируется.
  var TELEGRAM_USERNAME = 'rien_01';

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (id) { return document.getElementById(id); };
  var yes = $('yes'), no = $('no'), slot = $('slot'), hint = $('hint');

  /* ---------- Лепестки ---------- */
  var petals = $('petals');
  for (var i = 0; i < 12; i++) {
    var p = document.createElement('i');
    p.className = 'petal';
    p.style.left = (Math.random() * 100) + '%';
    p.style.setProperty('--sz', (10 + Math.random() * 12) + 'px');
    p.style.setProperty('--dur', (16 + Math.random() * 14) + 's');
    p.style.setProperty('--delay', (-Math.random() * 30) + 's');
    p.style.setProperty('--drift', (Math.random() * 200 - 100) + 'px');
    petals.appendChild(p);
  }

  /* ---------- Переключение экранов ---------- */
  var current = 's1';
  function show(id) {
    document.getElementById(current).classList.remove('on');
    var el = document.getElementById(id);
    el.classList.add('on');
    current = id;
    var h = el.querySelector('h1, h2');
    if (h) { try { h.focus({ preventScroll: true }); } catch (e) {} }
    window.scrollTo(0, 0);
  }

  /* ---------- Сердечки ---------- */
  function burst(x, y, n) {
    if (reduce) return;
    for (var i = 0; i < n; i++) {
      var h = document.createElement('span');
      h.className = 'heart';
      h.textContent = '\u2665';
      h.style.left = x + 'px';
      h.style.top = y + 'px';
      h.style.fontSize = (14 + Math.random() * 22) + 'px';
      document.body.appendChild(h);
      var ang = Math.random() * Math.PI * 2;
      var dist = 90 + Math.random() * 160;
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 60;
      var rot = (Math.random() * 120 - 60);
      var a = h.animate([
        { transform: 'translate(-50%,-50%) scale(.4) rotate(0deg)', opacity: 1 },
        { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(1) rotate(' + rot + 'deg)', opacity: 0 }
      ], { duration: 1000 + Math.random() * 800, easing: 'cubic-bezier(.2,.7,.3,1)' });
      a.onfinish = (function (el) { return function () { el.remove(); }; })(h);
    }
  }
  function centerOf(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  /* ---------- Убегающая кнопка «Нет» ---------- */
  var taunts = [
    'Ой, кнопка убежала',
    'Она очень застенчивая',
    'Может, всё-таки «Да»?',
    'Не поймаешь',
    'Быстрее, чем кажется',
    'Кнопка «Да» уже заждалась',
    'Остался только один честный вариант'
  ];
  var fixed = false, curX = 0, curY = 0, dodges = 0;
  var lastX = -9999, lastY = -9999;

  function noRect() {
    if (!fixed) return no.getBoundingClientRect();
    var w = no.offsetWidth, h = no.offsetHeight;
    return { left: curX, top: curY, right: curX + w, bottom: curY + h, width: w, height: h };
  }

  function makeFixed() {
    if (fixed) return;
    var r = no.getBoundingClientRect();
    slot.style.width = r.width + 'px';
    slot.style.height = r.height + 'px';
    no.style.left = r.left + 'px';
    no.style.top = r.top + 'px';
    curX = r.left; curY = r.top;
    no.classList.add('fixed');
    no.getBoundingClientRect(); // фиксируем стартовую позицию для анимации
    fixed = true;
  }

  function dodge() {
    makeFixed();
    var bw = no.offsetWidth, bh = no.offsetHeight;
    var vw = window.innerWidth, vh = window.innerHeight;
    var mx = 16, my = 48;
    var yr = yes.getBoundingClientRect();
    var px = lastX > -9000 ? lastX : curX + bw / 2;
    var py = lastY > -9000 ? lastY : curY + bh / 2;
    var best = null, bestScore = -Infinity;

    for (var i = 0; i < 60; i++) {
      var x = mx + Math.random() * Math.max(0, vw - bw - 2 * mx);
      var y = my + Math.random() * Math.max(0, vh - bh - 2 * my);
      var d = Math.hypot(x + bw / 2 - px, y + bh / 2 - py);
      var moved = Math.hypot(x - curX, y - curY);
      var overYes = x < yr.right + 24 && x + bw > yr.left - 24 && y < yr.bottom + 24 && y + bh > yr.top - 24;
      var score = Math.min(d, 420) + Math.min(moved, 220) * 0.5 - (overYes ? 1000 : 0);
      if (score > bestScore) { bestScore = score; best = { x: x, y: y }; }
    }
    curX = best.x; curY = best.y;
    no.style.left = curX + 'px';
    no.style.top = curY + 'px';

    dodges++;
    var k = Math.floor((dodges - 1) / 2);
    var idx = k < taunts.length ? k : 2 + ((k - taunts.length) % (taunts.length - 2));
    hint.textContent = taunts[idx];
    yes.style.setProperty('--s', Math.min(1 + dodges * 0.04, 1.35));
  }

  function stop(e) { if (e.cancelable) e.preventDefault(); }

  no.addEventListener('pointerenter', function (e) { lastX = e.clientX; lastY = e.clientY; dodge(); });
  no.addEventListener('pointerdown', function (e) { stop(e); lastX = e.clientX; lastY = e.clientY; dodge(); });
  no.addEventListener('touchstart', function (e) { stop(e); var t = e.touches[0]; if (t) { lastX = t.clientX; lastY = t.clientY; } dodge(); }, { passive: false });
  no.addEventListener('mousedown', stop);
  no.addEventListener('click', function (e) { stop(e); dodge(); });
  no.addEventListener('focus', function () { dodge(); no.blur(); });

  document.addEventListener('pointermove', function (e) {
    lastX = e.clientX; lastY = e.clientY;
    if (current !== 's1' || e.pointerType === 'touch') return;
    var r = noRect();
    var dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
    var dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    if (Math.hypot(dx, dy) < 70) dodge();
  });

  window.addEventListener('resize', function () {
    if (!fixed) return;
    var maxX = Math.max(16, window.innerWidth - no.offsetWidth - 16);
    var maxY = Math.max(48, window.innerHeight - no.offsetHeight - 48);
    curX = Math.min(Math.max(16, curX), maxX);
    curY = Math.min(Math.max(48, curY), maxY);
    no.style.left = curX + 'px';
    no.style.top = curY + 'px';
  });

  /* ---------- «Да» ---------- */
  yes.addEventListener('click', function () {
    var c = centerOf(yes);
    burst(c.x, c.y, 26);
    setTimeout(function () { show('s2'); }, reduce ? 0 : 700);
  });

  /* ---------- Дата и время ---------- */
  var dateEl = $('date'), timeEl = $('time'), err = $('err');
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var now = new Date();
  var todayIso = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  dateEl.min = todayIso;

  var dateText = '', timeText = '';
  $('confirm').addEventListener('click', function () {
    err.textContent = '';
    if (!dateEl.value) { err.textContent = 'Выбери день — без даты никак.'; dateEl.focus(); return; }
    if (dateEl.value < todayIso) { err.textContent = 'Этот день уже прошёл. Выбери другой.'; dateEl.focus(); return; }
    if (!timeEl.value) { err.textContent = 'Выбери время.'; timeEl.focus(); return; }

    var parts = dateEl.value.split('-').map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    var opts = { weekday: 'long', day: 'numeric', month: 'long' };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
    dateText = new Intl.DateTimeFormat('ru-RU', opts).format(d);
    timeText = timeEl.value;

    $('whenDate').textContent = dateText;
    $('whenTime').textContent = 'в ' + timeText;
    var c = centerOf($('confirm'));
    burst(c.x, c.y, 34);
    setTimeout(function () { show('s3'); }, reduce ? 0 : 600);
  });

  /* ---------- Отправить ответ ---------- */
  $('send').addEventListener('click', function () {
    var text = 'Да! Свидание — ' + dateText + ', в ' + timeText + ' 💘';
    var out = $('msg');
    if (TELEGRAM_USERNAME) {
      window.open('https://t.me/' + encodeURIComponent(TELEGRAM_USERNAME) + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
      return;
    }
    var done = function () { out.textContent = 'Ответ скопирован — отправь его мне'; };
    var fallback = function () { out.textContent = text; };
    if (navigator.share) {
      navigator.share({ text: text }).catch(function (e) {
        if (e && e.name === 'AbortError') return;
        copy();
      });
    } else { copy(); }
    function copy() {
      try {
        navigator.clipboard.writeText(text).then(done, fallback);
      } catch (e) { fallback(); }
    }
  });
})();
</script>
</body>
</html>
